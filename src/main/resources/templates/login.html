<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ログインフォーム</title>
    <style>
		input{
			border: 1px solid #333333;
			width: 200px;
			
		}
		button {
			margin-top: 20px;
		    padding: 10px 20px;
		    background: #007bff;
		    color: white;
		    border: none;
		    border-radius: 4px;
		}
		
	</style>
</head>
<body>
	<h1>ログインしてください</h1>
	<form action="/login" method="post">
		<!--入力欄-->
		<label for = "username">ユーザー名:</label>
		<input type="email" name="username" id = "username" placeholder ="メールアドレスを入力して下さい" required>
		<div>
			<label for = "password">パスワード:</label>
			<input type="password" name="password" id = "password" minlength = "8" required>
		</div>
		<!--ハイパーリンク-->
		<div>
		<a href = "http://localhost:8080/forgetpassword" >パスワードをお忘れの方はこちら</a>
		</div>
		<div>
			<a href = "http://localhost:8080/newRegistration" >初めてログインする方はこちら</a>
		</div>
		
		<div th:if="${error}">
		    <p th:text="${error}" style="color:red;"></p>
		</div>

		<!--ボタン-->
		<button type="submit">送信</button>
		
	</form>
	
	
	
</body>
